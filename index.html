<script>
'use strict';
// ---------- utilidades ----------
const KEY = 'naptime.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const dayNum = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; };
const addDays = (s, n) => { const d = new Date(dayNum(s)*864e5 + n*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const toMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const fmtDate = s => new Date(dayNum(s)*864e5).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});

const blank = () => ({name:'', startDate:'', wakeTime:'07:00', branch:null, offset:0, repeats:0, pausedDates:[], logs:{}, checks:{}, prep:{}});
function load(){ try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch { return blank(); } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { alert('No se pudo guardar. Exporta una copia desde Ajustes.'); } }

// Día del programa. 0 = preparación. Los días en pausa no cuentan; si hoy está en pausa se congela el día anterior.
function programDay(st, t){
  if (!st.startDate) return null;
  const raw = dayNum(t) - dayNum(st.startDate) + 1;
  if (raw < 1) return 0;
  const pausedBefore = st.pausedDates.filter(d => d >= st.startDate && d < t).length;
  const todayPaused = st.pausedDates.includes(t) ? 1 : 0;
  return Math.max(1, raw - pausedBefore - todayPaused - (st.offset||0));
}

// ---------- contenido del programa ----------
const SAFE = ['Boca arriba siempre, en colchón firme con sábana ajustable.','Cuna vacía: sin almohadas, peluches, chichoneras ni mantas (usad saco de dormir).','Cuna en vuestra habitación al menos hasta los 6 meses.','Si intenta darse la vuelta, dejad el arrullo con brazos atrapados: saco con brazos libres.','Nada de dormir en sofá o sillón con ella en brazos.'];

const PREP = [
  ['ped','Comentar el plan con el pediatra (peso, salud, reflujo) y tener su visto bueno.'],
  ['dark','Habitación a oscuras total para la noche y siestas (persianas, cinta en LEDs).'],
  ['noise','Ruido blanco continuo, volumen bajo (como una ducha), toda la noche.'],
  ['temp','Temperatura 20-22 °C y saco de dormir adecuado (TOG según temperatura).'],
  ['crib','Cuna segura y preparada según las normas de sueño seguro.'],
  ['roles','Acordar quién hace qué: quien no da el pecho lidera los reasentamientos (no huele a leche).'],
  ['wake','Elegir hora fija de despertar (ponedla en Ajustes).'],
  ['agree','Comprometeros los dos con 2 semanas de constancia antes de juzgar resultados.'],
];

const W2_LADDER = 'Escalera de ayuda (1-2 min por escalón, sube solo si el llanto va a más): esperar en silencio → voz suave/“shhh” → mano quieta en el pecho → palmaditas o mecer la cuna → cogerla solo hasta que se calme (no hasta que se duerma) y volver a dejarla.';
const FEED_RULE = 'Despertar nocturno: si han pasado ≥3 h desde la última toma → toma tranquila, a oscuras, sin hablar; despegadla cuando la succión se ralentice y a la cuna somnolienta. Si alguna toma de madrugada acaba dormida, no pasa nada: lo clave es la hora de acostarla. Si han pasado <3 h → volver a dormirla sin pecho (mejor el otro progenitor).';
const INTERVALS = [[3,5,10],[5,10,12],[10,12,15]];

function weekOf(d){ return d===0 ? 0 : Math.min(5, Math.ceil(d/7)); }

function getDay(d, branch){
  if (d === 0) return {phase:'Día 0 · Preparación', title:'Preparad el terreno', steps:PREP.map(p=>p[1]), expect:'Aún no cambia nada. Cuanto mejor esté el entorno, más fácil será todo lo demás.', night:'Seguid como siempre. Revisad la lista de preparación.', prep:true};
  if (d > 35) return {phase:'Programa completado', title:'Mantenimiento', steps:[
    'Mantened la rutina de noche siempre igual, también de viaje.',
    'Si enferma o le ponen vacunas: consolad todo lo necesario y volved al plan en cuanto esté bien (48 h sin síntomas).',
    'Hacia los 5-7 meses pasará a 3 siestas: alargad las ventanas de vigilia 15 min cada vez.',
    'Si un hábito antiguo vuelve (dormirse al pecho), repetid 3-4 noches de la semana 2: se recupera rápido.'],
    expect:'Habrá noches malas puntuales (dientes, saltos de desarrollo). No significa que se haya perdido lo aprendido.', night:'Rutina → cuna despierta → buenas noches → salir.'};

  const R1 = 'Rutina de 20-30 min, siempre igual: baño (o lavado rápido) → pijama y saco → toma en la habitación con luz tenue → canción → cuna.';
  const R = 'Rutina de 20-30 min, siempre igual: baño → toma con luz tenue → pañal, pijama y saco → canción o cuento → cuna despierta. Entre el final de la toma y la cuna deben pasar 5-10 min: así el pecho deja de ser lo último antes de dormir.';
  if (d <= 3) return {phase:'Semana 1 · Cimientos', title:`Día ${d}: observar y registrar`, steps:[
    `Despertarla a las ${S.wakeTime} (±30 min) y abrir persianas: la luz de la mañana fija su reloj.`,
    'Respetar ventanas de vigilia de 1h30-2h15 (usa la calculadora de abajo).',
    'Seguir durmiéndola como siempre: estos días solo se observa.',
    'Anotar las señales de sueño que veis: mirada perdida, frotarse ojos, bostezos, quejidos.',
    'Registrar la noche y las siestas en la pestaña Registro.'],
    expect:'Nada cambia todavía. Estos datos son vuestra línea base para ver el progreso.',
    night:'Como siempre. Apuntad hora de acostarla, cuánto tarda, despertares y tomas.'};
  if (d <= 7) {
    const early = d <= 5;
    return {phase:'Semana 1 · Cimientos', title: early ? `Día ${d}: rutina y despegar del pecho al final de la toma` : `Día ${d}: despegar antes y terminar en la cuna`, steps:[
      R1,
      'Siestas: como siempre, con pecho. Todo el trabajo se hace de noche.',
      early
        ? 'Toma de dormir como siempre, pero cuando la succión se vuelva lenta y floja (ya no traga), despegadla con suavidad metiendo un dedo en la comisura. Si busca el pecho o protesta, volved a ponerla y repetid al cabo de 1-2 min.'
        : 'Despegadla un poco antes, cuando esté muy somnolienta pero aún no dormida, y dejadla en la cuna. Ayudad ahí con mano en el pecho y “shhh”.',
      early
        ? 'Terminad de dormirla en brazos (sin pecho). Estos días no se busca que se duerma sola: solo que se acostumbre a dormirse sin el pezón en la boca.'
        : 'Si en 10-15 min no lo consigue, cogedla en brazos hasta que se calme y probad otra vez. Si llora mucho, pecho sin culpa: mañana se intenta de nuevo.',
      'Mismo despegue en la primera toma nocturna si os veis con fuerzas. En el resto de la noche, como siempre.',
      'Tomas de día completas y tranquilas, sin distracciones: menos hambre por la noche.',
      'De noche, al oírla: esperar 2-3 min antes de entrar (usa el temporizador). Muchos ruidos son sueño activo, no despertares.'],
      expect: early ? 'Al principio protestará al despegarla y quizá haya que repetirlo 5-10 veces. Normalmente en 2-3 noches lo acepta mejor. La noche apenas cambia todavía.' : 'Algunas noches lo conseguirá en la cuna y otras no. Es normal: cada intento cuenta.',
      night: early ? 'Rutina completa → toma → despegar cuando la succión se ralentice → terminar en brazos → cuna.' : 'Rutina → toma → despegar muy somnolienta → cuna con mano y “shhh”.'};
  }

  const cp = d === 14 ? ['Esta noche registrad bien: mañana toca el punto de control.'] : [];
  if (d <= 14) {
    const contact = d <= 10 ? 'Usad toda la escalera si hace falta.' : d <= 12 ? 'Quitad contacto: como mucho mano quieta y voz. Coger solo si el llanto va a más.' : 'Solo voz y presencia desde la silla. Sin tocar salvo llanto intenso.';
    return {phase:'Semana 2 · Dormirse en la cuna, acompañada', title:`Día ${d}: ${d===8?'primera noche dormida en la cuna':d<=10?'constancia':d<=12?'menos contacto':'solo presencia'}`, steps:[
      R,
      'Acostarla DESPIERTA. Sentaos en una silla pegada a la cuna.',
      W2_LADDER,
      contact,
      'A la hora de acostarla, nunca el pecho para dormirla: si llora con hambre real, toma, pero vuelve a la cuna despierta.',
      FEED_RULE,
      'Siestas: como siempre, con pecho si hace falta. Que duerma bien de día ayuda a que la noche sea más fácil.',
      ...cp],
      expect: d===8 ? 'Primera noche: puede tardar 30-60 min y llorar acompañada. Estáis a su lado; es lo esperado.' : d<=10 ? 'Las noches 2-4 suelen ser las más duras. La constancia ahora es lo que más cuenta.' : 'Hacia el día 12-14 debería dormirse en la cuna en menos de 20-30 min con vuestra presencia.',
      night:`Despierta a la cuna, silla al lado. ${contact}`};
  }

  if (d <= 21) {
    const n = d - 14;
    if (branch === 'B') {
      const iv = INTERVALS[Math.min(n,3)-1];
      return {phase:'Semana 3 · Rama B: visitas a intervalos', title:`Día ${d}: noche ${n} de intervalos (${iv.join(' - ')} min)`, steps:[
        R + ' Hacedla tranquila y cariñosa.',
        'Dejarla despierta, decir siempre la misma frase (“buenas noches, te quiero, a dormir”) y salir.',
        `Si llora, esperad los intervalos de hoy: ${iv.join(', ')} min (y luego ${iv[2]} min). Usad el temporizador.`,
        'Visitas de 1-2 min: voz y mano, sin coger, sin encender luz. Después, salir aunque siga llorando.',
        'Si el llanto pasa a gritos desconsolados más de 15 min seguidos, cogedla hasta que se calme y volved a dejarla. No es un fracaso.',
        FEED_RULE + ' Si no toca toma, mismos intervalos empezando por el primero.',
        'Siestas: como siempre, con pecho. Los intervalos son solo para la noche.'],
        expect: n===1 ? 'El llanto puede durar 20-45 min la primera noche. Es lo esperado.' : n<=3 ? 'Las noches 2-3 suelen ser el pico, a veces peores que la primera. Mantened el plan.' : n<=6 ? 'Mejora clara: cada vez menos llanto y se duerme antes.' : 'Puede haber una recaída puntual hacia la noche 5-7. Es normal: mantened el plan.',
        night:`Intervalos ${iv.join(' - ')} min. Visitas cortas, sin coger.`, timer:iv};
    }
    const pos = n<=3 ? 'a mitad de camino entre la cuna y la puerta' : n<=6 ? 'junto a la puerta' : 'fuera de la habitación; voz desde el pasillo si hace falta';
    return {phase:'Semana 3 · Rama A: retirada de la silla', title:`Día ${d}: silla ${n<=3?'a mitad de habitación':n<=6?'en la puerta':'fuera'}`, steps:[
      R,
      'Acostarla despierta y sentaos con la silla ' + pos + '.',
      'Si llora: primero voz desde la silla. Si va a más, acercaos, mano o palmaditas breves, y volved a la silla.',
      'Si una noche se descontrola (más de 5 min de llanto intenso), acercad la silla un poco solo esa noche. No retrocedáis más.',
      'Los despertares nocturnos se reasientan también desde la posición de la silla de hoy.',
      FEED_RULE,
      'Siestas: como siempre, con pecho.'],
      expect:'Más lento que con intervalos, pero con poco llanto. Debería seguir durmiéndose en menos de 20-30 min.',
      night:`Silla ${pos}.`};
  }

  if (d <= 28) {
    const how = branch==='B' ? 'intervalos (empezando por 10 min)' : 'voz desde fuera, entrando solo si el llanto va a más';
    return {phase:'Semana 4 · Consolidar la noche', title:`Día ${d}: noches completas en la cuna`, steps:[
      R,
      `Acostarla despierta y salir. Si llora: ${how}.`,
      `Mismo método en todos los despertares que no toquen toma. ${FEED_RULE}`,
      'En las tomas nocturnas, despegadla antes de que se duerma del todo y dejadla en la cuna despierta, igual que al acostarla.',
      'Antes de las 6:00 todo es “noche”: misma respuesta, sin luz, sin empezar el día.',
      'Siestas: como siempre. Si os apetece, podéis probar la primera de la mañana en la cuna, pero no es necesario.',
      'Si hay más de 2 tomas nocturnas: probad una toma del sueño hacia las 22-23 h (sin despertarla del todo).',
      'No eliminéis tomas nocturnas sin hablarlo con el pediatra: a esta edad 1-3 son normales.'],
      expect:'Se duerme sola en menos de 15 min. 1-2 tomas nocturnas. Los despertares extra van bajando.',
      night:`Rutina → cuna → salir. ${how[0].toUpperCase()+how.slice(1)}.`};
  }

  return {phase:'Semana 5 · Autonomía y mantenimiento', title: d===35 ? 'Día 35: ¡graduación!' : `Día ${d}: autonomía`, steps:[
    R,
    'Rutina → cuna despierta → buenas noches → salir.',
    'Siestas: como mejor os funcione. Más adelante, si queréis, se puede aplicar lo mismo de día.',
    'Alternad quién la acuesta: tiene que funcionar con los dos.',
    FEED_RULE,
    'Mantened la hora de despertar y las ventanas de vigilia: el horario es la mitad del éxito.',
    'Leed el plan de mantenimiento en Ayuda (enfermedad, viajes, cambio de siestas, cuando se gire).',
    ...(d===35 ? ['Mirad la pestaña Progreso: comparad la primera semana con esta. ¡Lo habéis conseguido!'] : [])],
    expect:'Se duerme sola en pocos minutos casi todas las noches. Alguna noche peor es normal.',
    night:'Rutina → cuna → salir.'};
}

const HELP = [
  {id:'unlatch', t:'Llora mucho al despegarla del pecho', c:'Es su forma de dormirse de siempre: el cambio cuesta, sobre todo las primeras noches.', f:'Despegad más tarde (cuando ya casi no succiona) y volved a ponerla al pecho tantas veces como haga falta; cada vez aguantará un poco más. Mecer, “shhh” o que la coja el otro progenitor ayuda. Si después de 3-4 noches no avanza nada, quedaos un par de noches más en el paso anterior.'},
  {id:'latency', t:'Tarda más de 30 min en dormirse', c:'Ventana de vigilia mal ajustada (poco cansada o pasada de cansancio), o la última siesta acaba demasiado tarde o pronto.', f:'Si protesta animada: alargad la ventana 15 min. Si llora frotándose ojos: acortad 15 min. La última siesta debería acabar 2-2h15 antes de acostarla. Probad 3 noches cada cambio.'},
  {id:'early30', t:'Se despierta a los 30-45 min de acostarla', c:'Sobrecansancio o entró en la cuna demasiado dormida.', f:'Acostadla 15-30 min antes y más despierta. Revisad que la rutina no acabe con ella dormida.'},
  {id:'frequent', t:'Se despierta cada 1-2 horas', c:'Sigue durmiéndose al pecho en algún momento (al acostar o en despertares), o tomas diurnas pequeñas.', f:'Revisad la regla de las 3 h y que nadie la duerma al pecho. Tomas diurnas completas y sin distracciones. Que el otro progenitor atienda los despertares que no tocan toma.'},
  {id:'early', t:'Se despierta antes de las 6:00', c:'Luz que entra, hambre, la 1.ª siesta demasiado pronto o sobrecansancio.', f:'Oscuridad total, tratad todo antes de las 6:00 como noche, no adelantéis la 1.ª siesta (mínimo 1h30 desde las 6-7). Revisad que no esté pasada de cansancio al acostarla.'},
  {id:'naps', t:'Siestas cortas (30-45 min)', c:'Normal hasta los 5-6 meses: su ciclo de sueño dura eso.', f:'No peleéis con ellas. Si se despierta llorando, podéis intentar 10 min de reasentar; si no, siesta de rescate. Lo importante es el sueño total del día.'},
  {id:'worse', t:'El llanto va a más tras 4-5 noches', c:'Inconsistencia (cada uno hace una cosa), hambre real, malestar o enfermedad.', f:'Repasad juntos el plan: ¿hacéis lo mismo los dos? Revisad tomas y salud. Volver una fase atrás está permitido. Si hay dudas de salud, pediatra.'},
  {id:'sick', t:'Fiebre, vacunas, mocos, dientes', c:'Malestar real: no es momento de aprender.', f:'Pulsad “Pausa hoy” en la pestaña Hoy. Consolad todo lo que haga falta. Volved al plan a las 48 h sin síntomas; suele recuperarse en 1-2 noches.'},
  {id:'tired', t:'Estáis agotados o no estáis de acuerdo', c:'La constancia de los dos importa más que la velocidad.', f:'Pausad o repetid la semana 2. Repartid noches (una noche cada uno). Elegid el método con el que los dos podáis ser constantes.'},
  {id:'roll', t:'Ha empezado a girarse', c:'Nueva habilidad: es normal que la practique en la cuna.', f:'Dejad el arrullo y usad saco con brazos libres. Practicad mucho boca abajo de día. Ponedla siempre boca arriba; si se gira sola y ya sabe volver, puede quedarse así.'},
  {id:'travel', t:'Viajes y cambios de rutina', c:'Entorno nuevo.', f:'Llevad saco, ruido blanco y la misma rutina. Al volver, 2-3 noches de constancia la devuelven al punto.'},
];
const DOCTOR = ['Ronquidos fuertes, pausas en la respiración o respira con esfuerzo.','Fiebre (≥38 °C con menos de 6 meses: consultad siempre).','Poca ganancia de peso, menos pañales mojados o rechaza tomas.','Llanto inconsolable que no parece de protesta, o dolor al comer/arquearse (posible reflujo).','Cualquier cosa que os preocupe: el pediatra tiene la última palabra.'];

// Reglas automáticas sobre las últimas noches registradas (lista ordenada por fecha).
function rules(logs){
  const L = logs.slice(-3), out = [];
  if (L.length < 3) return out;
  const lat = avg(L.map(l=>+l.latency).filter(n=>!isNaN(n)));
  if (lat !== null && lat > 30) out.push('latency');
  const wk = avg(L.map(l=>+l.wakings).filter(n=>!isNaN(n)));
  if (wk !== null && wk > 4) out.push('frequent');
  if (L.some(l => l.morning && toMin(l.morning) < 360)) out.push('early');
  const P = logs.slice(-6, -3);
  if (P.length === 3) {
    const cNow = avg(L.map(l=>+l.crying||0)), cPrev = avg(P.map(l=>+l.crying||0));
    if (cNow > cPrev + 0.5) out.push('worse');
  }
  return out;
}

// ---------- vistas ----------
let tab = 'hoy';
const TABS = [['hoy','☀️','Hoy'],['log','✏️','Registro'],['prog','📈','Progreso'],['plan','📖','Programa'],['help','🆘','Ayuda'],['cfg','⚙️','Ajustes']];
function sortedLogs(){ return Object.keys(S.logs).sort().map(k => ({date:k, ...S.logs[k]})); }

function render(){
  $('#nav').innerHTML = TABS.map(([k,i,l]) => `<button class="${k===tab?'on':''}" data-tab="${k}"><b>${i}</b>${l}</button>`).join('');
  const d = programDay(S, today());
  $('#hdr').textContent = d === null ? '' : d === 0 ? 'Preparación' : d > 35 ? 'Completado' : `Día ${d}/35`;
  $('#app').innerHTML = !S.startDate && tab !== 'cfg' && tab !== 'plan' && tab !== 'help' ? vSetup() : ({hoy:vHoy, log:vLog, prog:vProg, plan:vPlan, help:vHelp, cfg:vCfg})[tab]();
  if (tab === 'hoy') napCalc();
  window.scrollTo(0,0);
}

function vSetup(){
  return `<div class="card"><h2>Bienvenidos 👋</h2>
  <p>Programa de 5 semanas para que vuestra bebé aprenda a dormirse sola en la cuna por la noche (las siestas pueden seguir con pecho), empezando suave y avanzando según cómo responda.</p>
  <p class="mut">Los datos se guardan solo en este dispositivo. Exportad una copia de vez en cuando desde Ajustes.</p>
  <label class="f"><span>Nombre de la bebé</span><input id="s-name" value="${esc(S.name)}"></label>
  <label class="f"><span>Fecha de inicio (Día 1). Dejad unos días antes para la preparación.</span><input type="date" id="s-start" value="${addDays(today(),1)}"></label>
  <label class="f"><span>Hora fija de despertar</span><input type="time" id="s-wake" value="${esc(S.wakeTime)}"></label>
  <button data-act="setup">Empezar</button></div>
  <div class="card"><h2>Antes de empezar</h2><p class="mut">Ninguna estrategia ha demostrado ser mejor que otra: lo que predice el éxito es la constancia de los dos. Este plan no quita tomas nocturnas y no sustituye al pediatra.</p></div>`;
}

function checklist(items, store, prefix){
  return items.map((t,i) => { const k = prefix + i; return `<label class="chk"><input type="checkbox" data-chk="${k}" ${store[k]?'checked':''}><span>${t}</span></label>`; }).join('');
}

function vHoy(){
  const t = today(), d = programDay(S, t), paused = S.pausedDates.includes(t);
  const needCp = d >= 15 && !S.branch; // tras registrar la noche 14
  const day = getDay(needCp ? 14 : d, S.branch);
  const L = sortedLogs().filter(l => l.date <= t);
  const alerts = rules(L).map(id => HELP.find(h => h.id === id));
  const done = (S.checks[t] = S.checks[t] || {});
  let h = '';
  if (paused) h += `<div class="card warn"><h2>⏸️ Pausa activa hoy</h2><p>Modo consuelo: atended lo que necesite sin preocuparos del método. El programa no avanza hoy.</p><button class="sec" data-act="pause">Quitar pausa</button></div>`;
  if (needCp) h += vCheckpoint(L);
  h += `<div class="card"><span class="tag">${esc(day.phase)}</span><h2>${esc(day.title)}</h2>
    ${d>0&&d<=35?`<div class="prog"><i style="width:${d/35*100}%"></i></div>`:''}
    ${day.prep ? checklist(PREP.map(p=>p[1]), S.prep, 'p') : checklist(day.steps, done, 'd'+(needCp?14:d)+'-')}</div>`;
  h += `<div class="card"><h2>🌙 Plan de esta noche</h2><p>${esc(day.night)}</p>${d>=8&&d<=35?`<p class="mut">${esc(FEED_RULE)}</p>`:''}</div>`;
  h += `<div class="card"><h2>🔮 Qué esperar</h2><p>${esc(day.expect)}</p></div>`;
  alerts.forEach(a => h += `<div class="card warn"><h2>⚠️ ${esc(a.t)}</h2><p class="mut">Detectado en vuestros últimos registros.</p><p><b>Causa probable:</b> ${esc(a.c)}</p><p><b>Qué probar:</b> ${esc(a.f)}</p></div>`);
  h += vTimer(day.timer);
  h += `<div class="card"><h2>⏰ Calculadora de siestas</h2>
    <div class="row"><label class="f"><span>Se despertó a las</span><input type="time" id="nc-t" value="${esc(S.wakeTime)}"></label>
    <label class="f"><span>Ventana</span><select id="nc-w"><option value="90,105">1.ª del día (1h30-1h45)</option><option value="105,120">Intermedia (1h45-2h)</option><option value="120,135">Antes de dormir (2h-2h15)</option></select></label></div>
    <p id="nc-out" style="font-size:18px"></p><p class="mut">Empezad la rutina de siesta 10 min antes. Si veis señales de sueño antes, adelantad.</p></div>`;
  if (!paused && d > 0) h += `<div class="card"><h2>¿Enferma, vacunas o mala racha?</h2><p class="mut">Pausar hoy congela el programa: mañana se repite este día.</p><button class="sec" data-act="pause">⏸️ Pausa hoy</button></div>`;
  return h;
}

function vCheckpoint(L){
  const last = L.slice(-3);
  const lat = avg(last.map(l=>+l.latency).filter(n=>!isNaN(n)));
  const indep = last.filter(l => l.how === 'sola' || l.how === 'presencia').length;
  const good = lat !== null && lat <= 30 && indep >= 2;
  return `<div class="card okc"><h2>🚦 Punto de control (día 14)</h2>
    <p>Últimas noches: ${lat===null?'sin datos suficientes':`tarda de media <b>${Math.round(lat)} min</b>, ${indep}/${last.length} noches dormida en la cuna sin brazos ni pecho`}.</p>
    <p><b>Recomendación:</b> ${good ? 'va bien → <b>Rama A</b>: retirar la silla poco a poco.' : 'no avanza lo suficiente → si estáis cómodos, <b>Rama B</b> (visitas a intervalos); si no, repetid la semana 2.'}</p>
    <p class="mut">Rama A: más lenta, casi sin llanto. Rama B: suele funcionar en 3-7 noches, con llanto supervisado. Las dos son seguras; elegid la que podáis mantener los dos.</p>
    <div class="row"><button data-act="branchA">Rama A · silla</button><button data-act="branchB">Rama B · intervalos</button><button class="sec" data-act="repeat">Repetir semana 2</button></div></div>`;
}

// Temporizador: pausa de espera o secuencia de intervalos (rama B).
let T = {end:0, idx:0, seq:null, id:0};
function vTimer(seq){
  const s = seq || [3];
  return `<div class="card"><h2>⏱️ Temporizador</h2>
    <div class="big" id="tm">--:--</div><p class="mut" id="tm-msg" style="text-align:center">${seq?`Intervalos de hoy: ${seq.join(' → ')} min`:'Pausa antes de acudir'}</p>
    <div class="row">${seq?`<button data-act="tstart" data-seq="${s.join(',')}">Empezar intervalos</button><button class="sec" data-act="tnext">Siguiente visita</button>`:`<button data-act="tstart" data-seq="2">2 min</button><button data-act="tstart" data-seq="3">3 min</button>`}<button class="sec" data-act="tstop">Parar</button></div></div>`;
}
function startStep(){
  const m = T.seq[Math.min(T.idx, T.seq.length-1)];
  T.end = Date.now() + m*60e3;
  clearInterval(T.id); T.id = setInterval(tick, 250); tick();
  const msg = $('#tm-msg'); if (msg) msg.textContent = T.seq.length>1 ? `Espera ${T.idx+1}: ${m} min` : `Esperando ${m} min`;
}
function tick(){
  const el = $('#tm'), left = Math.max(0, T.end - Date.now());
  if (el) el.textContent = `${pad(Math.floor(left/60e3))}:${pad(Math.floor(left/1e3)%60)}`;
  if (left === 0) {
    clearInterval(T.id);
    navigator.vibrate?.([300,150,300]);
    try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 520; g.gain.value = .08; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .6); } catch {}
    const msg = $('#tm-msg'); if (msg) msg.textContent = T.seq.length>1 ? '¡Toca visita! 1-2 min, voz y mano, sin coger. Luego pulsa “Siguiente visita”.' : 'Tiempo. Si sigue llorando, acudid.';
  }
}

    <label class="f"><span>Noche que empieza el día</span><input type="date" id="l-date" value="${date}" max="${t}"></label>

    <label class="f"><span>Notas</span><textarea id="l-notes">${v('notes')}</textarea></label>
    <div class="row"><button data-act="savelog">Guardar</button>${S.logs[date]?'<button class="bad" data-act="dellog">Borrar</button>':''}</div></div>
    <div class="card"><h2>Historial</h2>${sortedLogs().reverse().map(x=>`<details><summary>${fmtDate(x.date)} · ${x.latency??'?'} min · ${x.wakings??'?'} desp.</summary><p class="mut">A la cuna ${esc(x.bed||'?')} · ${esc(x.how||'?')} · tomas ${esc(x.feeds??'?')} · despertó ${esc(x.morning||'?')} · siestas ${esc(x.naps??'?')}${x.notes?'<br>'+esc(x.notes):''}</p><button class="sec" data-act="editlog" data-date="${x.date}">Editar</button></details>`).join('') || '<p class="mut">Aún no hay registros.</p>'}</div>`;
}

function bars(rows, key, color, unit){
  const vals = rows.map(r => +r[key]).map(n => isNaN(n) ? 0 : n);
  const max = Math.max(1, ...vals), w = 300, h = 120, bw = w / Math.max(vals.length, 1);
  return `<svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="${unit}">
    ${vals.map((v,i) => { const bh = v/max*h; return `<rect x="${i*bw+1}" y="${h-bh}" width="${Math.max(bw-2,1)}" height="${bh}" rx="2" fill="${color}"><title>${rows[i].date}: ${v} ${unit}</title></rect>`; }).join('')}
    <text x="0" y="${h+12}">${rows[0]?fmtDate(rows[0].date):''}</text><text x="${w}" y="${h+12}" text-anchor="end">${rows.length?fmtDate(rows[rows.length-1].date):''}</text><text x="0" y="10">${max} ${unit}</text></svg>`;
}

function vProg(){
  const L = sortedLogs();
  if (!L.length) return '<div class="card"><h2>📈 Progreso</h2><p class="mut">Registrad algunas noches para ver la evolución.</p></div>';
  const first = L.slice(0,3), last = L.slice(-3);
  const m = (a,k) => { const x = avg(a.map(l=>+l[k]).filter(n=>!isNaN(n))); return x===null?'–':Math.round(x*10)/10; };
  const indep = a => Math.round(a.filter(l=>l.how==='sola'||l.how==='presencia').length / a.length * 100) + '%';
  return `<div class="card"><h2>📈 Antes y ahora</h2><p class="mut">Primeras 3 noches vs últimas 3</p>
    <table><tr><th></th><th>Antes</th><th>Ahora</th><th>Objetivo sem. 4-5</th></tr>
    <tr><td>Min. hasta dormirse</td><td>${m(first,'latency')}</td><td>${m(last,'latency')}</td><td>&lt;15</td></tr>
    <tr><td>Despertares</td><td>${m(first,'wakings')}</td><td>${m(last,'wakings')}</td><td>1-3</td></tr>
    <tr><td>Tomas nocturnas</td><td>${m(first,'feeds')}</td><td>${m(last,'feeds')}</td><td>1-2</td></tr>
    <tr><td>Se duerme en la cuna</td><td>${indep(first)}</td><td>${indep(last)}</td><td>100%</td></tr></table></div>
    <div class="card"><h2>Minutos hasta dormirse</h2>${bars(L,'latency','var(--acc)','min')}</div>
    <div class="card"><h2>Despertares por noche</h2>${bars(L,'wakings','var(--blue)','desp.')}</div>
    <div class="card"><h2>Tomas nocturnas</h2>${bars(L,'feeds','var(--ok)','tomas')}</div>
    <div class="card"><h2>Progreso esperado</h2><ul>
    <li><b>Semana 1:</b> la noche casi no cambia; se instaura la rutina.</li>
    <li><b>Semana 2:</b> noches 2-4 duras; al final se duerme en la cuna con vosotros en &lt;20-30 min.</li>
    <li><b>Semana 3:</b> rama A: menos presencia, poco llanto. Rama B: pico de llanto noches 2-3, mejora clara en 3-7 noches.</li>
    <li><b>Semana 4:</b> &lt;15 min, 1-2 tomas, menos despertares; en las tomas nocturnas vuelve a la cuna despierta.</li>
    <li><b>Semana 5:</b> se duerme sola casi todas las noches.</li></ul></div>`;
}

function vPlan(){
  const cur = S.startDate ? programDay(S, today()) : -1;
  const weeks = [[0,0,'Día 0 · Preparación'],[1,7,'Semana 1 · Cimientos'],[8,14,'Semana 2 · Dormirse en la cuna, acompañada'],[15,21,'Semana 3 · Rama A (silla) o B (intervalos)'],[22,28,'Semana 4 · Consolidar la noche'],[29,35,'Semana 5 · Autonomía']];
  const dayHtml = (n, br) => { const g = getDay(n, br); return `<details ${n===cur?'open':''}><summary>${n===cur?'👉 ':''}${esc(g.title)}${br?` <span class="tag">Rama ${br}</span>`:''}</summary><ul>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p><b>Esta noche:</b> ${esc(g.night)}</p><p class="mut"><b>Esperado:</b> ${esc(g.expect)}</p></details>`; };
  return `<div class="card"><h2>📖 El programa completo</h2><p class="mut">Enfoque escalonado y centrado en la noche: primero se despega poco a poco del pecho al dormirse, luego dos semanas acompañada en la cuna, punto de control el día 14 y después vosotros decidís cómo seguir.</p></div>` +
    weeks.map(([a,b,t]) => { let inner = '';
      for (let n=a; n<=b; n++) inner += (n>=15&&n<=21) ? (S.branch!=='B'?dayHtml(n,'A'):'') + (S.branch!=='A'?dayHtml(n,'B'):'') : dayHtml(n, S.branch);
      return `<div class="card"><h2>${t}</h2>${inner}</div>`; }).join('') + `<div class="card">${(()=>{const g=getDay(36);return `<h2>Después: ${g.title}</h2><ul>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`})()}</div>`;
}

function napCalc(){
  const t = $('#nc-t'), w = $('#nc-w'), out = $('#nc-out');
  if (!t) return; // pantalla inicial
  const upd = () => { const m = toMin(t.value); if (m===null) return out.textContent=''; const [a,b] = w.value.split(',').map(Number); out.innerHTML = `Próximo sueño entre <b>${fromMin(m+a)}</b> y <b>${fromMin(m+b)}</b>`; };
  t.oninput = w.onchange = upd; upd();
}

// ---------- acciones ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-act]'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; window._logDate = null; return render(); }
  const t = today(), a = b.dataset.act, val = id => $(id).value.trim();
  if (a === 'setup') { if (!val('#s-start')) return alert('Elegid una fecha de inicio.'); Object.assign(S, {name:val('#s-name'), startDate:val('#s-start'), wakeTime:val('#s-wake')||'07:00'}); }
  else if (a === 'pause') { S.pausedDates = S.pausedDates.includes(t) ? S.pausedDates.filter(d=>d!==t) : [...S.pausedDates, t]; }
  else if (a === 'branchA' || a === 'branchB') { S.branch = a.slice(-1); }
  else if (a === 'repeat') { const d = programDay(S, t); S.offset = (S.offset||0) + (d - 8); S.repeats++; }
  else if (a === 'savelog') {
    const date = val('#l-date'); if (!date) return alert('Elegid la fecha.');
    const keys = ['bed','latency','how','wakings','feeds','morning','crying','naps','notes'];
    S.logs[date] = Object.fromEntries(keys.map(k => [k, val('#l-'+k)]).filter(([,v]) => v !== ''));
    window._logDate = null; save(); tab = 'hoy'; return render();
  }
  else if (a === 'dellog') { if (!confirm('¿Borrar este registro?')) return; delete S.logs[val('#l-date')]; window._logDate = null; }
  else if (a === 'editlog') { window._logDate = b.dataset.date; return render(); }
  else if (a === 'savecfg') { Object.assign(S, {name:val('#c-name'), startDate:val('#c-start'), wakeTime:val('#c-wake')||'07:00', branch:val('#c-branch')||null}); alert('Guardado'); }
  else if (a === 'export') { const url = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); Object.assign(document.createElement('a'),{href:url,download:`naptime-${t}.json`}).click(); setTimeout(()=>URL.revokeObjectURL(url),1000); return; }
  else if (a === 'import') { const f = $('#c-file'); f.onchange = () => { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (typeof d !== 'object' || !d.logs) throw 0; S = Object.assign(blank(), d); save(); alert('Datos importados'); render(); } catch { alert('Archivo no válido'); } }; r.readAsText(f.files[0]); }; f.click(); return; }
  else if (a === 'reset') { if (!confirm('¿Seguro? Se borrará todo. Exportad antes una copia si la queréis.')) return; S = blank(); tab = 'hoy'; }
  else if (a === 'tstart') { T.seq = b.dataset.seq.split(',').map(Number); T.idx = 0; return startStep(); }
  else if (a === 'tnext') { if (!T.seq) return; T.idx++; return startStep(); }
  else if (a === 'tstop') { clearInterval(T.id); T.seq = null; $('#tm').textContent = '--:--'; return; }
  save(); render();
});
document.addEventListener('change', e => {
  const k = e.target.dataset.chk; if (!k) return;
  const store = k[0] === 'p' ? S.prep : (S.checks[today()] = S.checks[today()] || {});
  store[k] = e.target.checked; save();
});
document.addEventListener('change', e => { if (e.target.id === 'l-date') { window._logDate = e.target.value; render(); } });

// ---------- autotest: abrir con ?test ----------
if (location.search.includes('test')) {
  const ok = [], A = (c, m) => { if (!c) throw new Error('FALLO: ' + m); ok.push(m); };
  const st = {...blank(), startDate:'2026-01-01'};
  A(programDay(st,'2025-12-30') === 0, 'antes del inicio = preparación');
  A(programDay(st,'2026-01-01') === 1, 'primer día = 1');
  A(programDay(st,'2026-01-14') === 14, 'día 14');
  A(programDay({...st, pausedDates:['2026-01-05']},'2026-01-05') === 4, 'hoy en pausa congela el día anterior');
  A(programDay({...st, pausedDates:['2026-01-05']},'2026-01-06') === 5, 'tras la pausa se repite el día');
  A(programDay({...st, offset:6},'2026-01-14') === 8, 'repetir semana 2 vuelve al día 8');
  A(getDay(16,'B').timer.join() === '5,10,12', 'rama B noche 2 = 5-10-12');
  A(getDay(21,'B').timer.join() === '10,12,15', 'rama B noche 7 = 10-12-15');
  A(getDay(40).title === 'Mantenimiento', 'después del día 35 = mantenimiento');
  const lg = (lat,wk,mo,cr) => ({latency:String(lat), wakings:String(wk), morning:mo, crying:String(cr)});
  A(rules([lg(40,2,'07:00',0),lg(35,2,'07:00',0),lg(45,2,'07:00',0)]).includes('latency'), 'regla latencia');
  A(rules([lg(10,6,'07:00',0),lg(10,5,'07:00',0),lg(10,5,'07:00',0)]).includes('frequent'), 'regla despertares');
  A(rules([lg(10,1,'05:30',0),lg(10,1,'07:00',0),lg(10,1,'07:00',0)]).includes('early'), 'regla madrugón');
  A(rules([lg(10,1,'07:00',0),lg(10,1,'07:00',0),lg(10,1,'07:00',0),lg(10,1,'07:00',3),lg(10,1,'07:00',3),lg(10,1,'07:00',2)]).includes('worse'), 'regla empeora');
  A(rules([lg(10,1,'07:00',0),lg(10,1,'07:00',0)]).length === 0, 'sin reglas con menos de 3 noches');
  document.body.innerHTML = `<main><div class="card okc"><h2>✅ ${ok.length} tests OK</h2><ul>${ok.map(m=>`<li>${m}</li>`).join('')}</ul></div></main>`;
} else render();
